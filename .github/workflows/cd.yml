name: CD

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: docker
    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}  
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: backend_cloud
          push: true
          tags: ${{ secrets.REGISTRY_HOST }} /robo-munch-backend-cloud:latest
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            docker pull ${{ secrets.REGISTRY_HOST }}/robo-munch-backend-cloud:latest
            docker stop robo-munch-backend-cloud || true
            docker rm robo-munch-backend-cloud || true
            docker run -d --name robo-munch-backend-cloud -p 8000:8000 ${{ secrets.REGISTRY_HOST }}/robo-munch-backend-cloud:latest
